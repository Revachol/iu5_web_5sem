basePath: /
definitions:
  ds.Historical_service:
    properties:
      createdAt:
        type: string
      dataSource:
        type: string
      description:
        type: string
      historicalPeriod:
        type: string
      historicalRegion:
        type: string
      id:
        type: integer
      imageURL:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      priceUSD:
        type: number
      unit:
        type: string
    type: object
host: 127.0.0.1
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Bmstu Open IT Platform
  license:
    name: AS IS (NO WARRANTY)
  title: История и Культура 26. Расчет бюджета создания постройки/произведения с учетом
    исторического индекса цен
  version: "1.0"
paths:
  /api/add_to_estimate/{id}:
    post:
      consumes:
      - application/json
      description: Добавляет указанную услугу в текущую черновую заявку (корзину)
        пользователя. Если черновика нет, он создается.
      parameters:
      - description: ID исторической услуги для добавления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном добавлении и информация о заявке
          schema:
            type: object
        "400":
          description: Неверный ID параметра
          schema:
            type: object
        "500":
          description: Ошибка сервера (например, при создании черновика)
          schema:
            type: object
      summary: Добавить услугу в черновую заявку
      tags:
      - estimates
  /api/create_object:
    post:
      consumes:
      - application/json
      description: Создает новую запись исторической услуги в базе данных.
      parameters:
      - description: Данные для создания услуги
        in: body
        name: Historical_service
        required: true
        schema:
          $ref: '#/definitions/ds.Historical_service'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно созданная услуга
          schema:
            type: object
        "400":
          description: Некорректный JSON или неверные данные
          schema:
            type: object
        "500":
          description: Ошибка сервера
          schema:
            type: object
      summary: Создать новую историческую услугу
      tags:
      - services
  /api/historical_object/{id}:
    delete:
      description: Удаляет услугу из базы данных по её ID.
      parameters:
      - description: ID исторической услуги для удаления
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            type: object
        "400":
          description: Неверный ID параметра
          schema:
            type: object
        "500":
          description: Ошибка сервера
          schema:
            type: object
      summary: Удалить историческую услугу
      tags:
      - services
    get:
      consumes:
      - application/json
      description: Возвращает полную информацию об исторической услуге по её ID.
      parameters:
      - description: ID исторической услуги (объекта)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            type: object
        "400":
          description: Неверный ID параметра
          schema:
            type: object
        "404":
          description: Объект не найден
          schema:
            type: object
        "500":
          description: Ошибка сервера
          schema:
            type: object
      summary: Получить услугу по ID
      tags:
      - services
    put:
      consumes:
      - application/json
      description: Обновляет существующую услугу по её ID.
      parameters:
      - description: ID исторической услуги для обновления
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления услуги
        in: body
        name: Historical_service
        required: true
        schema:
          $ref: '#/definitions/ds.Historical_service'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно обновленная услуга
          schema:
            type: object
        "400":
          description: Неверный ID или некорректный JSON
          schema:
            type: object
        "500":
          description: Ошибка сервера
          schema:
            type: object
      summary: Обновить историческую услугу
      tags:
      - services
  /api/historical_object/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Загружает изображение для конкретной исторической услуги. Использует
        multipart/form-data.
      parameters:
      - description: ID исторической услуги
        in: path
        name: id
        required: true
        type: integer
      - description: Файл изображения
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешной загрузке
          schema:
            type: object
        "400":
          description: Неверный ID или файл не предоставлен
          schema:
            type: object
        "500":
          description: Ошибка сервера при обработке файла
          schema:
            type: object
      summary: Загрузить изображение для услуги
      tags:
      - services
  /api/historical_objects:
    get:
      consumes:
      - application/json
      description: Возвращает список всех исторических услуг. Может быть отфильтрован
        по названию.
      parameters:
      - description: Название услуги (частичное совпадение)
        in: query
        name: title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список исторических услуг
          schema:
            type: object
        "500":
          description: Ошибка сервера
          schema:
            type: object
      summary: Получить список услуг
      tags:
      - services
schemes:
- http
swagger: "2.0"
