<html lang="en">
<head>
    <title>Historical Objects</title>
    <link rel="stylesheet" href="/static/styles/index_style.css">
</head>
<header>
    <a href="/" class="home-link"><h1>Главная</h1></a>
    <a href="/"><img class="logo" src="/static/img/Vector_1.svg" alt="home"></a>
</header>
<form action="/hello" method="GET" class="search-form">
    <input type="text" name="query" placeholder="Введите запрос" value="{{ .query }}">
    <button type="submit">Найти</button>
</form>

<div class="cards-container">
    {{ range .historical_objects }}
    <div class="card">
        <a href="/order/{{ .ID }}"><img src="{{ .Img }}" alt="{{ .Title }}"></a>
        <p class="price">{{ .Price }} / за {{ .Value }}</p>
        <h3 class="title">{{ .Title }}</h3>
        <div class="buttons">
            <a href="/order/{{ .ID }}" class="details-button">Подробнее</a>
            <button class="buy-button">Купить</button>
        </div>
    </div>
    {{ end }}
</div>
<div class="basket-container">
    <a href="/basket">
        <img src="/static/img/pngwing.com.png" alt="basket">
    </a>
</div>
</html>
